mzc_productfields_field_index:
  path: /mzcproductfields/field
  methods: [GET]
  defaults:
    _controller: 'MZConsulting\MzcProductFields\Controller\FieldController::indexAction'
    _legacy_controller: AdminMzcProductFieldsFields
    _legacy_link: AdminMzcProductFieldsFields

